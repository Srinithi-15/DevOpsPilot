name: DevOpsPilot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # 1. Backend Pipeline: Java 21 + Spring Boot + Maven Wrapper + Test Verification
  # ============================================================================
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Execute Backend Tests & Flyway Schema Validation
        run: ./mvnw clean test -B
        working-directory: backend

      - name: Package Executable JAR
        run: ./mvnw package -DskipTests -B
        working-directory: backend

      - name: Archive Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/backend-0.0.1-SNAPSHOT.jar
          retention-days: 7

  # ============================================================================
  # 2. Frontend Pipeline: Node.js + npm ci + React JSX Production Bundle
  # ============================================================================
  frontend-ci:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Production Bundle Build
        run: npm run build
        working-directory: frontend

      - name: Run Security Dependency Audit
        run: npm audit --audit-level=high || true
        working-directory: frontend

      - name: Archive Frontend Static Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # 3. Docker Pipeline & Free Security Scanning (Trivy)
  # ============================================================================
  docker-build-and-security:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: devopspilot-backend:${{ github.sha }}

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: devopspilot-frontend:${{ github.sha }}

      - name: Trivy Vulnerability Scan (Backend Container)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devopspilot-backend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Trivy Vulnerability Scan (Frontend Container)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devopspilot-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
