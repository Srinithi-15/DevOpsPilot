global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: 'devopspilot-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['devopspilot-backend:8080']
        labels:
          application: 'devopspilot-backend'
          environment: 'production'
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'devopspilot-backend-host'
          environment: 'local'

  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
