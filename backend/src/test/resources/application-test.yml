server:
  port: 8081

spring:
  application:
    name: devopspilot-backend-test

  datasource:
    url: jdbc:h2:mem:devopspilot_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
